name: Build and Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (installateur + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances du moteur
        run: pip install -r app/main/ipc/requirements.txt
      - name: Tests du moteur
        run: python -m unittest discover -s tests/engine -p "test_*.py"
      - name: Dépendances de l'application
        run: npm ci || npm install
        working-directory: app
      - name: Interface
        run: npm install && npm run build
        working-directory: app/renderer
      - name: Gel du moteur Python (exécutable autonome)
        run: node scripts/build-engine.js
      - name: Installateur Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable --publish always
        working-directory: app
      - name: Artefact Windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            app/dist-build/*Setup*.exe
            app/dist-build/*Portable*.exe

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances du moteur
        run: pip install -r app/main/ipc/requirements.txt
      - name: Tests du moteur
        run: python -m unittest discover -s tests/engine -p "test_*.py"
      - name: Dépendances de l'application
        run: npm ci || npm install
        working-directory: app
      - name: Interface
        run: npm install && npm run build
        working-directory: app/renderer
      - name: Gel du moteur Python
        run: node scripts/build-engine.js
      - name: DMG macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --publish always
        working-directory: app
      - name: Artefact macOS
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: app/dist-build/*.dmg
